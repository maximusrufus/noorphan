[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noorphan"
version = "0.1.0"
description = "Run a command so that every descendant dies when it exits or the wrapper is killed."
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
psutil = ["psutil"]
test = ["pytest"]

[project.scripts]
noorphan = "noorphan.__main__:main"

[tool.setuptools]
packages = ["noorphan"]
