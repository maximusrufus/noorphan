name: action-test
on: [push, pull_request]
jobs:
  clean:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: start
      - uses: ./
        with:
          mode: check
  leaky:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: start
      - name: Leave a detached sleeper (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          if os.fork() == 0:
              os.setsid()
              if os.fork() == 0:
                  fd = os.open(os.devnull, os.O_RDWR)
                  for n in (0, 1, 2):
                      os.dup2(fd, n)
                  os.execvp("sleep", ["sleep", "600"])
              os._exit(0)
          os.wait()
          PY
      - name: Leave a detached sleeper (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys
          args = ["ping", "-n", "600", "127.0.0.1"]
          flags = 0x00000008 | 0x00000200  # DETACHED_PROCESS | CREATE_NEW_PROCESS_GROUP
          kw = dict(stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, close_fds=True)
          try:
              subprocess.Popen(args, creationflags=flags | 0x01000000, **kw)  # + BREAKAWAY_FROM_JOB
          except OSError:
              subprocess.Popen(args, creationflags=flags, **kw)
          PY
      - name: Diagnose (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-CimInstance Win32_Process -Filter "Name='PING.EXE'" | Select-Object ProcessId,ParentProcessId,CommandLine | Format-List
      - id: check
        uses: ./
        continue-on-error: true
        with:
          mode: check
      - name: Assert the sleeper was found and the check failed
        shell: bash
        env:
          OUTCOME: ${{ steps.check.outcome }}
          PATTERN: ${{ runner.os == 'Windows' && 'ping' || 'sleep 600' }}
        run: |
          echo "check outcome: $OUTCOME"
          test "$OUTCOME" = "failure"
          python - "$RUNNER_TEMP/found.json" "$PATTERN" <<'PY'
          import json, re, sys
          found = json.load(open(sys.argv[1]))
          print([f["cmd"] for f in found])
          assert any(re.search(sys.argv[2], f["cmd"]) for f in found), "sleeper not reported"
          PY
