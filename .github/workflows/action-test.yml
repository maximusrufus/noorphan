name: action-test
on: [push, pull_request]
jobs:
  clean:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: start
      - uses: ./
        with:
          mode: check
  leaky:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: start
      - name: Leave a detached sleeper (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          nohup sleep 600 > /dev/null 2>&1 &
          disown
      - name: Leave a detached sleeper (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: start /b ping -n 600 127.0.0.1 > nul
      - id: check
        uses: ./
        continue-on-error: true
        with:
          mode: check
      - name: Assert the check failed
        shell: bash
        run: |
          echo "check outcome: ${{ steps.check.outcome }}"
          test "${{ steps.check.outcome }}" = "failure"
