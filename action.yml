name: noorphan
description: Fail the job if it leaves orphaned processes behind.
inputs:
  mode:
    description: "start (snapshot existing orphans) or check (fail on new orphans)"
    default: check
  allow:
    description: "Newline- or comma-separated regexes on process name or command line to ignore"
    default: ""
  baseline:
    description: "Snapshot existing orphans in start mode and ignore them in check mode"
    default: "true"
  python-version:
    description: "Python version to set up; leave empty to use the runner's Python"
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      if: inputs.python-version != ''
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install noorphan
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}[psutil]"
    - name: noorphan ${{ inputs.mode }}
      shell: bash
      env:
        NOORPHAN_MODE: ${{ inputs.mode }}
        NOORPHAN_ALLOW: ${{ inputs.allow }}
        NOORPHAN_BASELINE: ${{ inputs.baseline }}
        NOORPHAN_FILE: ${{ runner.temp }}/noorphan-baseline.json
      run: |
        if [ "$NOORPHAN_MODE" = "start" ]; then
          if [ "$NOORPHAN_BASELINE" = "true" ]; then
            python -m noorphan scan --json > "$NOORPHAN_FILE"
            echo "baseline saved"
          fi
        elif [ "$NOORPHAN_MODE" = "check" ]; then
          args=(--fail)
          if [ "$NOORPHAN_BASELINE" = "true" ] && [ -f "$NOORPHAN_FILE" ]; then
            args+=(--baseline "$NOORPHAN_FILE")
          fi
          if [ -n "$NOORPHAN_ALLOW" ]; then
            args+=(--allow "$NOORPHAN_ALLOW")
          fi
          python -m noorphan scan --json "${args[@]}" > "$RUNNER_TEMP/found.json" || true
          python -m noorphan scan "${args[@]}"
        else
          echo "unknown mode: $NOORPHAN_MODE" >&2
          exit 2
        fi
